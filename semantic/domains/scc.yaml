# SCC — semantic mapping (proposed)
version: "0.1.0"
datasetId: scc
displayName: SupplyOn Collaboration Center (SCC)
serviceCode: SCC
physicalSource:
  kind: json
  path: data/sim/scc.json
  rowGrain: One row per purchase order line in the sim file.

entity:
  id: purchase_order
  label: Purchase order
  description: >
    A purchase order (PO) exchanged in SCC between a customer and a supplier.
    Use for transactional usage questions (PO counts, status breakdown). Join
    to SLM on customerId and supplierId to relate POs to service rollout and
    to enrich with supplierName from SLM if needed.

attributes:
  - id: customer_id
    physicalField: customerId
    type: string
    description: >
      Customer owning this PO. Join to SLM.customerId and to dcm/src customerId
      for the same buyer context.
    synonyms:
      - customer id
      - buyer id

  - id: supplier_id
    physicalField: supplierId
    type: string
    description: >
      Supplier on this PO. Join to SLM.supplierId for rollout; same key as DCM
      and SRC for multi-service supplier analysis.
    synonyms:
      - supplier id
      - vendor id

  - id: purchase_order_number
    physicalField: purchaseOrderNr
    type: string
    description: >
      Unique purchase order identifier in sim data (PO-######). Use for
      drill-down or deduplication; not a join key across datasets.
    synonyms:
      - purchase order number
      - PO number
      - PO nr
      - Bestellnummer

  - id: purchase_order_description
    physicalField: purchaseOrderDescription
    type: string
    description: >
      Short text describing the purchase order. Suitable for display in chat
      answers; avoid using as a filter key unless the user quotes exact text.
    synonyms:
      - PO description
      - order description
      - Bestelltext

  - id: po_status
    physicalField: poStatus
    type: enum
    description: >
      Lifecycle state of the purchase order in SCC. Use for status dashboards
      and confirmed vs new pipeline questions.
    synonyms:
      - PO status
      - order status
      - purchase order status
      - Bestellstatus

enums:
  poStatus:
    - value: New
      description: >
        PO created or sent but not yet confirmed by the supplier in the sim
        model. Count toward open pipeline / rollout activity.
    - value: Confirmed
      description: >
        PO acknowledged or confirmed. Count toward established SCC usage.
